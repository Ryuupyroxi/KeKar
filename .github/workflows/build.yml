name: build
on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-22.04          # oldest glibc we support -> widest compatibility
    permissions:
      contents: write            # needed to attach builds to a release
    strategy:
      matrix:
        variant: [full, lite]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - name: Resolve variant names
        id: names
        shell: bash
        run: |
          if [ "${{ matrix.variant }}" = "lite" ]; then
            echo "app=KeKarLite" >> "$GITHUB_OUTPUT"
          else
            echo "app=KeKar" >> "$GITHUB_OUTPUT"
          fi
      # The full suite exercises the agent, portals and Marketplace; those
      # tests are deliberately full-mode only. Lite runs the variant-aware,
      # packaging and CLI suites that are valid for both products.
      - run: pytest -q
        if: matrix.variant == 'full'
      - name: Test ${{ matrix.variant }}
        if: matrix.variant == 'lite'
        run: >-
          pytest -q tests/test_features.py tests/test_kekar_lite.py
          tests/test_lite_ui.py tests/test_tour.py tests/test_main_cli.py
          tests/test_set_variant.py tests/test_usb_packaging.py
          tests/test_bundle_safety.py
      - name: Build ${{ matrix.variant }}
        run: |
          python tools/set_variant.py ${{ matrix.variant }} -- \
            python -m PyInstaller KeKar.spec --noconfirm
      - name: Package ${{ matrix.variant }}
        run: >-
          python tools/make_usb_package.py --platform linux
          --source dist/${{ steps.names.outputs.app }}
          --out out/${{ steps.names.outputs.app }}_Linux
          --variant ${{ matrix.variant }}
      - name: Verify ${{ matrix.variant }} package
        run: >-
          python tools/verify_usb.py out/${{ steps.names.outputs.app }}_Linux
          --platform linux --variant ${{ matrix.variant }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.names.outputs.app }}_Linux
          path: out/${{ steps.names.outputs.app }}_Linux/

      - name: Zip the Linux package
        run: cd out && zip -qr ${{ steps.names.outputs.app }}_Linux.zip ${{ steps.names.outputs.app }}_Linux

      - name: Attach the Linux build to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: out/${{ steps.names.outputs.app }}_Linux.zip

  windows:
    runs-on: windows-latest
    permissions:
      contents: write            # needed to attach builds to a release
    strategy:
      matrix:
        variant: [full, lite]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # The pytest suite is POSIX-oriented and is run on the Linux job: it
      # asserts Unix path separators, executable bits, and deletes database
      # files that Windows keeps locked. The Windows job builds and packages.
      - run: pip install -r requirements.txt
      - name: Resolve variant names
        id: names
        shell: bash
        run: |
          if [ "${{ matrix.variant }}" = "lite" ]; then
            echo "app=KeKarLite" >> "$GITHUB_OUTPUT"
          else
            echo "app=KeKar" >> "$GITHUB_OUTPUT"
          fi
      - name: Build ${{ matrix.variant }}
        shell: pwsh
        run: |
          python tools/set_variant.py ${{ matrix.variant }} -- python -m PyInstaller KeKar.spec --noconfirm
      - name: Package ${{ matrix.variant }}
        shell: pwsh
        run: |
          python tools/make_usb_package.py --platform windows --source dist/${{ steps.names.outputs.app }} --out out/${{ steps.names.outputs.app }}_Windows --variant ${{ matrix.variant }}
      - name: Verify ${{ matrix.variant }} package
        shell: pwsh
        run: |
          python tools/verify_usb.py out/${{ steps.names.outputs.app }}_Windows --platform windows --variant ${{ matrix.variant }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.names.outputs.app }}_Windows
          path: out/${{ steps.names.outputs.app }}_Windows/

      - name: Zip the Windows package
        shell: pwsh
        run: |
          $app = "${{ steps.names.outputs.app }}"
          Compress-Archive -Path "out/${app}_Windows" -DestinationPath "out/${app}_Windows.zip"

      # NSIS is not on the runner image. choco installs it to
      # C:\Program Files (x86)\NSIS but does not put it on PATH, so the
      # compiler is invoked by full path (probed on the runner, 2026-11-16).
      - name: Compile the NSIS installer
        if: matrix.variant == 'full'
        shell: pwsh
        run: |
          choco install nsis --yes --no-progress
          $nsis = "C:\Program Files (x86)\NSIS\makensis.exe"
          & $nsis /VERSION
          $ver = (Select-String -Path "$env:GITHUB_WORKSPACE\packaging\windows\KeKar_Installer.nsi" `
                  -Pattern '^!define VERSION "([^"]+)"').Matches.Groups[1].Value
          $out = "$env:GITHUB_WORKSPACE\out\KeKar_Setup_$ver.exe"
          # Both the package folder and the output path are absolute: NSIS
          # anchors relative File and OutFile paths to the script, not to the
          # working directory.
          & $nsis "/DKEKAR_PACKAGE_DIR=$env:GITHUB_WORKSPACE\out\KeKar_Windows" `
                  "/DKEKAR_OUT_FILE=$out" `
                  "$env:GITHUB_WORKSPACE\packaging\windows\KeKar_Installer.nsi"
          Get-Item $out | Select-Object Name, Length

      - name: Attach the installer to the release
        if: github.event_name == 'release' && matrix.variant == 'full'
        uses: softprops/action-gh-release@v2
        with:
          files: out/KeKar_Setup_*.exe

      - name: Attach the Windows build to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: out/${{ steps.names.outputs.app }}_Windows.zip
