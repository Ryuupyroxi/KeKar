name: probe
on: workflow_dispatch
jobs:
  nsis:
    runs-on: windows-latest
    steps:
      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --yes
      - name: Locate and run makensis
        shell: pwsh
        run: |
          Get-ChildItem "C:\Program Files (x86)\NSIS" -ErrorAction SilentlyContinue |
            Select-Object Name
          Write-Host "--- bare name ---"
          makensis /VERSION
          Write-Host "--- full path ---"
          & "C:\Program Files (x86)\NSIS\makensis.exe" /VERSION
