name: probe
on: workflow_dispatch
jobs:
  nsis:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find where choco actually put makensis
        shell: pwsh
        run: |
          choco install nsis --yes --no-progress | Out-Null
          foreach ($p in @(
            "C:\Program Files (x86)\NSIS",
            "C:\Program Files\NSIS",
            "C:\ProgramData\chocolatey\lib\nsis",
            "C:\ProgramData\chocolatey\lib\nsis\tools"
          )) {
            Write-Host "=== $p ==="
            Write-Host ("exists: " + (Test-Path $p))
            if (Test-Path $p) { Get-ChildItem $p -Recurse -Filter makensis.exe |
                                Select-Object -ExpandProperty FullName }
          }
          Write-Host "=== machine PATH entries containing NSIS ==="
          [System.Environment]::GetEnvironmentVariable("Path", "Machine") -split ";" |
            Where-Object { $_ -match "NSIS" }
